<text x="24" y="90" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">안녕하세요, 컴퓨터소프트웨어공학을 전공하는 주니어</text>
<text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">개발자 <tspan font-weight="700">DevLSJ</tspan>입니다.</text>
<text x="24" y="144" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">Kotlin으로 모바일 앱을, Java와 TypeScript로 관리자</text>
<text x="24" y="165" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">웹을, Python으로 탐지 서비스를 만들어 봤습니다. 지금은</text>
<text x="24" y="186" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve"><tspan font-weight="700">eBPF</tspan>로 리눅스 커널 레벨에서 공급망 공격을 잡아내는</text>
<text x="24" y="207" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">캡스톤 프로젝트에 집중하고 있습니다.</text>
<text x="24" y="240" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">애플리케이션 위에서만 보던 문제를 커널 아래에서 다시</text>
<text x="24" y="261" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">보는 일에 재미를 붙였고, 새 시스템 기술은 읽는 것보다 직접</text>
<text x="24" y="282" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Noto Sans KR',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c0caf5" xml:space="preserve">만들어 보면서 배우는 편입니다.</text>
